<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SnapSub – AI Shorts Maker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
        color: #f9fafb;
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 20px;
      }

      .shell {
        width: 100%;
        max-width: 1150px;
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2.3fr);
        gap: 20px;
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .card,
      .side {
        border-radius: 20px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: radial-gradient(circle at top left, #111827 0, #020617 45%);
        box-shadow: 0 22px 55px rgba(0, 0, 0, 0.65);
      }

      .card {
        padding: 22px 22px 18px;
      }

      .side {
        padding: 18px 18px 14px;
      }

      .logo-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        border-radius: 14px;
        background: conic-gradient(
          from 140deg,
          #22c55e,
          #38bdf8,
          #a855f7,
          #f97316,
          #22c55e
        );
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 18px;
        color: #0b1120;
      }

      .logo-text-main {
        font-weight: 700;
        font-size: 1.2rem;
      }

      .logo-text-sub {
        font-size: 0.8rem;
        color: #9ca3af;
      }

      .pill-badge {
        font-size: 0.75rem;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(22, 163, 74, 0.18);
        color: #bbf7d0;
        border: 1px solid rgba(34, 197, 94, 0.5);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 18px;
      }

      .pill {
        font-size: 0.75rem;
        padding: 4px 9px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(75, 85, 99, 0.75);
        color: #e5e7eb;
      }

      label {
        display: block;
        font-size: 0.82rem;
        color: #e5e7eb;
        margin-bottom: 4px;
      }

      input[type="file"],
      input[type="number"],
      input[type="text"],
      select {
        width: 100%;
        font-size: 0.9rem;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(55, 65, 81, 0.9);
        background: rgba(15, 23, 42, 0.9);
        color: #f9fafb;
      }

      input[type="file"] {
        padding-top: 6px;
        padding-bottom: 6px;
      }

      small.helper {
        font-size: 0.74rem;
        color: #6b7280;
      }

      .row {
        display: flex;
        gap: 12px;
        margin-bottom: 14px;
      }

      .row > div {
        flex: 1;
      }

      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
        margin-bottom: 10px;
      }

      button {
        cursor: pointer;
        border-radius: 999px;
        border: none;
        padding: 9px 17px;
        font-size: 0.9rem;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: transform 0.1s ease, box-shadow 0.1s ease,
          background 0.15s ease, border-color 0.15s ease;
      }

      button.primary {
        background: linear-gradient(135deg, #22c55e, #22c55e, #4ade80);
        color: #022c22;
        box-shadow: 0 14px 30px rgba(16, 185, 129, 0.6);
      }

      button.secondary {
        background: rgba(15, 23, 42, 0.95);
        color: #e5e7eb;
        border: 1px solid rgba(148, 163, 184, 0.7);
      }

      button.ghost {
        background: rgba(15, 23, 42, 0.6);
        color: #94a3b8;
        border: 1px dashed rgba(148, 163, 184, 0.6);
      }

      button:active {
        transform: translateY(1px);
        box-shadow: none;
      }

      .status {
        font-size: 0.82rem;
        margin-top: 6px;
        min-height: 18px;
      }

      .status.ok {
        color: #4ade80;
      }

      .status.err {
        color: #f97373;
      }

      .side-title {
        font-size: 0.98rem;
        font-weight: 600;
        margin: 4px 0 8px;
      }

      .timeline {
        list-style: none;
        padding: 0;
        margin: 0 0 10px;
      }

      .timeline li {
        display: flex;
        align with: flex-start;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px dashed rgba(55, 65, 81, 0.7);
      }

      .timeline li:last-child {
        border-bottom: none;
      }

      .step-dot {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, #22c55e, #16a34a);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        color: #ecfdf5;
        flex-shrink: 0.
      }

      #result ul {
        margin-top: 8px;
        padding-left: 18px;
        font-size: 0.82rem;
        line-height: 1.5;
      }

      #result a {
        color: #38bdf8;
        text-decoration: none;
      }

      #result a:hover {
        text-decoration: underline;
      }

      .result-card {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(71, 85, 105, 0.6);
        background: rgba(15, 23, 42, 0.9);
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.82rem;
      }

      .result-card span {
        color: #cbd5f5;
      }

      .tag-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(75, 85, 99, 0.75);
        font-size: 0.7rem;
      }

      .dropzone {
        margin-top: 8px;
        padding: 14px 12px;
        border-radius: 12px;
        border: 1.5px dashed rgba(75, 85, 99, 0.9);
        background: rgba(15, 23, 42, 0.8);
        font-size: 0.83rem;
        color: #9ca3af;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        text-align: center;
        transition: border-color 0.15s ease, background 0.15s ease,
          transform 0.1s ease;
      }

      .dropzone span.strong {
        color: #e5e7eb;
        font-weight: 500;
      }

      .dropzone.dragover {
        border-color: #38bdf8;
        background: rgba(15, 23, 42, 0.95);
        transform: translateY(-1px);
      }

      .file-name {
        margin-top: 4px;
        font-size: 0.76rem;
        color: #a5b4fc;
      }

      .advanced-panel {
        margin-top: 12px;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(75, 85, 99, 0.55);
        background: rgba(2, 6, 23, 0.85);
        display: none;
        gap: 12px;
        flex-direction: column;
        animation: fadeIn 0.2s ease;
      }

      .advanced-panel.active {
        display: flex;
      }

      .toggle-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .toggle-row label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.78rem;
        cursor: pointer;
      }

      input[type="checkbox"] {
        accent-color: #22c55e;
        width: auto;
        height: auto;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

    </div>

  </body>
</html>
