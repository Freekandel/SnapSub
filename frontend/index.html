<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapSub Studio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #18122b 0%, #090612 55%, #030108 100%);
      color: #f5f5ff;
    }
    header {
      padding: 48px 24px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 12px; font-size: clamp(2.4rem, 6vw, 3.8rem); }
    header p {
      margin: 0 auto;
      max-width: 640px;
      color: #c8c8e3;
      font-size: 1.05rem;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 64px;
      display: grid;
      gap: 32px;
    }
    .panel {
      background: rgba(18, 15, 30, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 55px rgba(3, 0, 12, 0.45);
      backdrop-filter: blur(18px);
    }
    .panel h2 { margin-top: 0; font-size: 1.35rem; }
    .upload-box {
      border: 1px dashed rgba(255, 255, 255, 0.35);
      border-radius: 20px;
      padding: 22px;
      text-align: center;
      margin-bottom: 18px;
    }
    .upload-box input[type="file"] {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .field input,
    .field select {
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(8, 5, 16, 0.55);
      color: #fff;
      font-size: 1rem;
    }
    .strategy-options {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .strategy-card {
      flex: 1 1 170px;
      min-width: 150px;
      padding: 16px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
    }
    .strategy-card:hover { transform: translateY(-2px); }
    .strategy-card input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .strategy-card input:checked + .strategy-label {
      border-color: #a46bff;
      box-shadow: 0 0 20px rgba(164, 107, 255, 0.35);
    }
    .strategy-label {
      display: block;
      border-radius: 14px;
      padding: 8px;
      border: 1px solid transparent;
    }
    .advanced-header {
      margin-top: 12px;
      border-radius: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .advanced-panel[hidden] { display: none; }
    .advanced-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    button.primary {
      width: 100%;
      margin-top: 10px;
      border: none;
      border-radius: 999px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(120deg, #8c2bff, #00d4ff 120%);
      color: #05020b;
      box-shadow: 0 18px 35px rgba(0, 212, 255, 0.35);
    }
    .status-banner {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      font-weight: 600;
      display: none;
    }
    .status-banner[data-state="success"] {
      border-color: rgba(94, 255, 201, 0.4);
      color: #8fffe0;
      background: rgba(94, 255, 201, 0.1);
    }
    .status-banner[data-state="error"] {
      border-color: rgba(255, 118, 118, 0.5);
      color: #ff9ea0;
      background: rgba(255, 255, 118, 0.12);
    }
    .clips-grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }
    .clip-card {
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 16px;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .clip-card video {
      width: 100%;
      border-radius: 12px;
      background: #040207;
    }
    .clip-card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .clip-card .meta a {
      text-decoration: none;
      color: #00d4ff;
      font-weight: 600;
    }
    .empty {
      text-align: center;
      color: #a8a8c5;
      padding: 18px;
    }
  </style>
</head>
<body>
  <header>
    <h1>SnapSub Studio</h1>
    <p>Upload a long-form video or paste a YouTube link, choose the clip strategy, and let SnapSub deliver ready-to-post shorts.</p>
  </header>

  <script>
    window.API_BASE = window.location.hostname.includes('localhost')
      ? 'http://127.0.0.1:8000'
      : 'https://snapsub-backend.onrender.com';
  </script>

  <main>
    <section class="panel">
      <h2>Source & Controls</h2>
      <form id="clip-form">
        <div class="upload-box">
          <p>Drag & drop or pick a file</p>
          <input id="video-file" type="file" accept="video/*" />
        </div>

        <div class="field">
          <label for="source-url">YouTube / public URL (optional)</label>
          <input id="source-url" type="url" placeholder="https://youtu.be/…" />
        </div>

        <div class="field">
          <label for="clip-length">Clip length (seconds)</label>
          <input id="clip-length" type="number" min="10" step="5" value="30" />
        </div>

        <div class="field">
          <span>Clip strategy</span>
          <div class="strategy-options">
            <label class="strategy-card">
              <input type="radio" name="strategy" value="evenly_spaced" checked />
              <span class="strategy-label">
                <strong>Evenly spaced</strong>
                <small>Uniform highlights across the video.</small>
              </span>
            </label>
            <label class="strategy-card">
              <input type="radio" name="strategy" value="scene_based" />
              <span class="strategy-label">
                <strong>Scene based</strong>
                <small>Automatic scene cut detection.</small>
              </span>
            </label>
            <label class="strategy-card">
              <input type="radio" name="strategy" value="randomized" />
              <span class="strategy-label">
                <strong>Randomized</strong>
                <small>Discover spontaneous gems.</small>
              </span>
            </label>
          </div>
        </div>

        <div class="advanced-header" id="advanced-toggle" aria-expanded="false">
          <span>Advanced controls</span>
          <span id="advanced-caret">▼</span>
        </div>

        <div class="advanced-panel" id="advanced-panel" hidden>
          <div class="advanced-grid">
            <div class="field">
              <label for="scene-threshold">Scene sensitivity (0–1)</label>
              <input id="scene-threshold" type="number" min="0" max="1" step="0.05" value="0.35" />
            </div>
            <div class="field">
              <label for="num-clips">Maximum clips</label>
              <input id="num-clips" type="number" min="1" max="20" value="6" />
            </div>
            <div class="field">
              <label for="watermark-text">Watermark text</label>
              <input id="watermark-text" type="text" placeholder="SnapSub" />
            </div>
            <div class="field">
              <label for="brand-color">Accent color</label>
              <input id="brand-color" type="color" value="#b987ff" />
            </div>
            <div class="field">
              <label for="captions">Captions language (ISO)</label>
              <input id="captions" type="text" placeholder="en" />
            </div>
          </div>
        </div>

        <button class="primary" type="submit" id="generate-btn">Generate clips</button>
        <div id="status-banner" class="status-banner"></div>
      </form>
    </section>

    <section class="panel">
      <h2>Generated Clips</h2>
      <div id="clips-grid" class="clips-grid">
        <p class="empty">No clips yet. Generate to see results here.</p>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = window.API_BASE;
    const API_PREFIX = `${API_BASE}/api`;

    const endpoints = {
      health: `${API_BASE}/health`,
      upload: `${API_PREFIX}/upload`,
      generate: `${API_PREFIX}/generate`,
      download: (videoId, name) =>
        `${API_PREFIX}/download?video_id=${encodeURIComponent(videoId)}&name=${encodeURIComponent(name)}`
    };

    const formEl = document.getElementById('clip-form');
    const uploadInput = document.getElementById('video-file');
    const sourceUrlInput = document.getElementById('source-url');
    const statusBanner = document.getElementById('status-banner');
    const clipsGrid = document.getElementById('clips-grid');
    const generateBtn = document.getElementById('generate-btn');

    const advancedToggle = document.getElementById('advanced-toggle');
    const advancedPanel = document.getElementById('advanced-panel');
    const advancedCaret = document.getElementById('advanced-caret');

    advancedToggle.addEventListener('click', () => {
      const expanded = advancedToggle.getAttribute('aria-expanded') === 'true';
      advancedToggle.setAttribute('aria-expanded', (!expanded).toString());
      advancedPanel.hidden = expanded;
      advancedCaret.textContent = expanded ? '▼' : '▲';
    });

    function setStatus(message, state = 'info') {
      statusBanner.textContent = message;
      statusBanner.dataset.state = state;
      statusBanner.style.display = 'block';
    }

    function clearStatus() {
      statusBanner.style.display = 'none';
      statusBanner.textContent = '';
    }

    async function checkHealth() {
      try {
        const res = await fetch(endpoints.health);
        if (!res.ok) throw new Error();
        setStatus('Backend connected ✅', 'success');
        setTimeout(clearStatus, 2500);
      } catch {
        setStatus('Backend unreachable. Confirm backend deployment.', 'error');
      }
    }

    function buildAdvancedPayload() {
      return {
        scene_thresh: Number(document.getElementById('scene-threshold').value) || 0.35,
        n_clips: Number(document.getElementById('num-clips').value) || 6,
        strategy: document.querySelector('input[name="strategy"]:checked').value,
      };
    }

    async function uploadSource(formData) {
      const res = await fetch(endpoints.upload, { method: 'POST', body: formData });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function requestGeneration(payload) {
      const res = await fetch(endpoints.generate, {
        method: 'POST',
        body: payload
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function renderClips(videoId, clips = []) {
      clipsGrid.innerHTML = '';
      if (!clips.length) {
        clipsGrid.innerHTML = '<p class="empty">No clips returned.</p>';
        return;
      }
      clips.forEach((clip, idx) => {
        const duration = Number(clip.duration ?? 0);
        const videoHref = clip.video?.startsWith('http')
          ? clip.video
          : `${API_BASE}${clip.video}`;
        const card = document.createElement('article');
        card.className = 'clip-card';
        card.innerHTML = `
          <video controls src="${videoHref}" preload="metadata"></video>
          <div class="meta">
            <div>
              <h4>Clip #${idx + 1}</h4>
              ${duration ? `<small>${duration.toFixed(1)}s</small>` : ''}
            </div>
            <a href="${videoHref}" download>Download</a>
          </div>
        `;
        clipsGrid.appendChild(card);
      });
    }

    formEl.addEventListener('submit', async (evt) => {
      evt.preventDefault();
      const file = uploadInput.files[0];
      const sourceUrl = sourceUrlInput.value.trim();

      if (!file && !sourceUrl) {
        setStatus('Provide a file or a source URL before generating.', 'error');
        return;
      }

      generateBtn.disabled = true;
      const uploadForm = new FormData();
      if (file) uploadForm.append('file', file);
      if (sourceUrl) uploadForm.append('source_url', sourceUrl);

      try {
        setStatus('Uploading source…');
        const uploadResp = await uploadSource(uploadForm);

        const jobId = uploadResp.job_id ?? uploadResp.id ?? uploadResp.video_id;
        if (!jobId) throw new Error('Upload response missing job ID.');

        const formPayload = new FormData();
        formPayload.append('video_id', jobId);
        formPayload.append('clip_len', document.getElementById('clip-length').value);
        formPayload.append('strategy', document.querySelector('input[name="strategy"]:checked').value);
        formPayload.append('n_clips', document.getElementById('num-clips').value);
        formPayload.append('scene_thresh', document.getElementById('scene-threshold').value);

        setStatus('Processing clips…');
        const { clips = [] } = await requestGeneration(formPayload);

        renderClips(jobId, clips);
        setStatus('Clips ready! ✅', 'success');
      } catch (err) {
        console.error(err);
        setStatus(`Error: ${err.message ?? err}`, 'error');
      } finally {
        generateBtn.disabled = false;
      }
    });

    checkHealth();
  </script>
</body>
</html>
